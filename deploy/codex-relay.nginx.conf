# Managed for Codex Relay; existing proxy ports and vhosts stay separate.
server {
    listen 9444 ssl;
    server_name 192.227.231.68;
    ssl_certificate /etc/letsencrypt/live/192.227.231.68/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/192.227.231.68/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;
    location = /api/v1/live {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
    }
}
